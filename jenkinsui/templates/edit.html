<!DOCTYPE html>
<html>
<head>
    <title>Edit Jenkins - {{ name }}</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
            background-color: #f8f9fa;
        }
        h1 {
            margin-bottom: 1rem;
        }
        textarea {
            width: 100%;
            height: 500px;
            font-family: monospace;
            font-size: 14px;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
        }
        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            display: inline-block;
            margin-top: 1rem;
            color: #007bff;
        }
    </style>
</head>
<body>
    <h1>Edit jcasc.yaml for {{ name }}</h1>

    <form method="post">
        {% csrf_token %}
        <textarea name="jcasc">{{ jcasc }}</textarea>
        <br />
        <button type="submit">Save Changes</button>
    </form>

    <a href="/">← Back to home</a>
</body>
</html>
