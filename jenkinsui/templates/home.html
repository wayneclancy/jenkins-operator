<!DOCTYPE html>
<html>
<head>
    <title>Jenkins Instances</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background: #f5f5f5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 1rem;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
        }
        .status {
            font-weight: bold;
        }
        .Running {
            color: green;
        }
        .Pending {
            color: orange;
        }
        .Failed {
            color: red;
        }
        .Unknown {
            color: gray;
        }
        .buttons a {
            margin-right: 0.5rem;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            background: #007bff;
            color: white;
            border-radius: 4px;
        }
        .buttons a.delete {
            background: #dc3545;
        }
    </style>

  <a href="/create/" style="margin-bottom: 20px; display: inline-block;">➕ Create New Jenkins</a>

</head>
<body>
    <h1>Jenkins Instances</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for instance in instances %}
            <tr>
                <td>{{ instance.metadata.name }}</td>
                <td class="status {{ instance.status }}">{{ instance.status }}</td>
                <td>{{ instance.metadata.creationTimestamp }}</td>
                <td class="buttons">
                    <a href="{% url 'view' instance.metadata.name %}">View</a>
                    <a href="{% url 'edit' instance.metadata.name %}">Edit</a>
                    <a href="{% url 'restart' instance.metadata.name %}">Restart</a>
                    <a href="{% url 'delete' instance.metadata.name %}" class="delete">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="4">No Jenkins instances found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
