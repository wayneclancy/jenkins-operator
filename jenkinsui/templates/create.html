<!DOCTYPE html>
<html>
<head>
  <title>Create Jenkins Instance</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jenkins-design-language/1.3.0/css/jenkins-design-language.min.css">
  <style>
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f9f9f9; padding: 30px; }
    form { background: white; padding: 20px; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; }
    input[type=text], textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[type=submit] {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type=submit]:hover {
      background-color: #45a049;
    }
    a { display: inline-block; margin-top: 20px; text-decoration: none; color: #4b8bc1; }
  </style>
</head>
<body>
<h1>Create Jenkins Instance</h1>
<form method="post">
  {% csrf_token %}
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" value="example" required>

  <label for="image">Docker Image:</label>
  <input type="text" id="image" name="image" value="jenkins/jenkins:2.504.3-lts" required>

  <label for="cluster">Cluster Path Prefix (e.g. /example):</label>
  <input type="text" id="cluster" name="cluster" value="/example" required>

  <label for="jcasc">JCasC YAML:</label>
  <textarea id="jcasc" name="jcasc" rows="20">
jenkins:
  systemMessage: "Managed by Jenkins UI"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  views:
    - all:
        name: "all"
  primaryView: "all"
  noUsageStatistics: true
  updateCenter:
    sites: []
  quietPeriod: 5
  numExecutors: 2
  mode: NORMAL
</textarea>

  <input type="submit" value="Create">
</form>
<a href="/">← Back to Dashboard</a>
</body>
</html>
